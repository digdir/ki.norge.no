name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ingen jobb her skriver til repoet. Uten dette arver de repo-standarden, som
# CodeQL flagger.
permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend (Astro/Node) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        working-directory: apps/frontend
        run: pnpm install --frozen-lockfile

      # Kjører før build, slik at en redaksjonell datafeil i
      # src/data/ki-tiltak.json stopper her med en tydelig melding i stedet for
      # å slippe gjennom. Build alene fanger den ikke, fordi siden er
      # server-rendret og modulen bundles uten å evalueres.
      - name: Unit tests
        working-directory: apps/frontend
        run: pnpm run test:unit

      # astro sync lager typene i .astro/ som tsconfig inkluderer.
      - name: Typesjekk
        working-directory: apps/frontend
        run: pnpm run typecheck

      # Cache-workeren foran ki.norge.no har egne tester, som ikke kjørte noe sted.
      - name: Cache-worker-tester
        run: pnpm --filter cache-kinorgeportal exec vitest run

      # CMS-proxyen foran cms.ki.norge.no har ingen egne avhengigheter, så testene
      # kjører på Node sin innebygde testløper.
      - name: CMS-proxy-tester
        run: node --test 'apps/cms-kinorgeportal/test/*.test.ts'

      - name: Build
        working-directory: apps/frontend
        run: pnpm run build

  cms-build:
    name: CMS (Umbraco/.NET) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Mirror content-routes into CMS project
        run: node scripts/sync-content-routes.js

      - name: Restore
        working-directory: apps/cms-umbraco
        run: dotnet restore

      - name: Build
        working-directory: apps/cms-umbraco
        run: dotnet build --no-restore -c Release

  smoke-prod:
    name: Smoke test prod (frontend + Delivery API)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run smoke tests
        run: bash scripts/smoke-test.sh --prod

  playwright-local-smoke:
    name: Playwright smoke (frontend + CMS auth)
    runs-on: ubuntu-latest
    needs: [frontend-build, cms-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: apps/frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Mirror content-routes into CMS project
        run: node scripts/sync-content-routes.js

      - name: Start CMS in background
        working-directory: apps/cms-umbraco
        run: nohup dotnet run > /tmp/cms.log 2>&1 &

      - name: Wait for CMS ready
        run: |
          for i in $(seq 1 100); do
            if curl -sf -o /dev/null -w '%{http_code}' http://localhost:5000/ | grep -qE '^(200|404|301|302)$'; then
              echo "CMS up after ${i}x3s"; exit 0
            fi
            sleep 3
          done
          echo "CMS failed to start within 5min. Last log:"
          tail -50 /tmp/cms.log
          exit 1

      - name: Start frontend in background
        working-directory: apps/frontend
        run: nohup pnpm run dev > /tmp/frontend.log 2>&1 &

      - name: Wait for frontend ready
        run: |
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:4321/; then
              echo "Frontend up after ${i}x3s"; exit 0
            fi
            sleep 3
          done
          echo "Frontend failed to start. Last log:"
          tail -30 /tmp/frontend.log
          exit 1

      - name: Run Playwright tests (frontend smoke + CMS auth-and-tree)
        working-directory: apps/frontend
        env:
          TARGET: local
        run: |
          npx playwright test --config=../../tests/playwright.config.ts --project=frontend tests/frontend/smoke.spec.ts
          npx playwright test --config=../../tests/playwright.config.ts --project=cms tests/cms/auth-and-tree.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report/
            test-results/
            /tmp/cms.log
            /tmp/frontend.log
          retention-days: 7

  # Måler bildeboksene på hver plassering i fire bredder mot mock-CMS-et. Bildene
  # hentes fra filer i repoet, og testen stopper alle andre forespørsler ut.
  bildeformater:
    name: Bildeformater (layouttest mot mock-CMS)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        working-directory: apps/frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Start mock-CMS og frontend
        working-directory: apps/frontend
        run: nohup node tools/mock-cms/dev.mjs --port 4321 > /tmp/frontend.log 2>&1 &

      - name: Vent på frontend
        run: |
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:4321/; then
              echo "Frontend oppe etter ${i}x3s"; exit 0
            fi
            sleep 3
          done
          echo "Frontend startet ikke. Siste logg:"
          tail -30 /tmp/frontend.log
          exit 1

      - name: Layouttest
        working-directory: apps/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4321
        run: pnpm exec playwright test tests/bildeformater.spec.ts --project=chromium --reporter=list,html

      - name: Last opp rapport ved feil
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bildeformater-rapport
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
            /tmp/frontend.log
          retention-days: 7

  usync-schema-guard:
    name: uSync schema guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # Trenger full historikk for aa sammenligne mot base-branchen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sjekk uSync-skjemafilene
        env:
          # Labelen schema-rekey-approved er den eksplisitte overstyringen.
          USYNC_REKEY_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'schema-rekey-approved') }}
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          bash scripts/check-usync-schema.sh "origin/${{ github.base_ref }}"

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy on repo (high/critical only, fail on found)
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: '.git,node_modules,.playwright-cli'
