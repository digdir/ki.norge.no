apiVersion: apps/v1
kind: Deployment
metadata:
  name: umbraco
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: umbraco
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umbraco
        azure.workload.identity/use: "true"
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        linkerd.io/inject: enabled
    spec:
      serviceAccountName: umbraco
      # 1654 is the app user in the .NET image. fsGroup makes umbraco-data (Azure Disk)
      # writable for it, including the files root created before. Requires image 72 or newer,
      # older images run as root and do not start with this. The linkerd containers
      # have their own runAsUser and override the pod level. Always rather than
      # OnRootMismatch, so the whole volume is fixed at every start. The volumes are small.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: Always
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: umbraco
          image: umbraco:1
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
          env:
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            # Without this Umbraco skips pending database migrations at
            # startup, and the Delivery API answers 200 OK with an empty list.
            - name: Umbraco__CMS__Unattended__UpgradeUnattended
              value: "true"
            # Without a persistent path the DataProtection keys end up pod-local, and then
            # all editors are logged out at every deploy because the backoffice
            # cookies cannot be decrypted by the new pod. umbraco-data is
            # mounted at /app/umbraco/Data and is ReadWriteOnce with replicas: 1.
            - name: DataProtection__KeyPath
              value: /app/umbraco/Data/DataProtection-Keys
            - name: KeyVault__AkvUri
              valueFrom:
                configMapKeyRef:
                  name: umbraco-dis-vault
                  key: AkvUri
            # Not used in any environment. "Publish Syncroot artifacts" rewrites both
            # to Azure SQL before the artifact is published.
            - name: ConnectionStrings__umbracoDbDSN
              value: "Data Source=|DataDirectory|/Umbraco.sqlite.db;Cache=Shared;Foreign Keys=True;Pooling=True"
            - name: ConnectionStrings__umbracoDbDSN_ProviderName
              value: "Microsoft.Data.Sqlite"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_SERVICE_NAME
              value: kinorgeportal
            - name: POD_UID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.uid=$(POD_UID)"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Kestrel only listens once Umbraco has started, and during an upgrade
          # the migrations run before that. If it gives up in the middle of a migration, it starts
          # over every time, hence 10 minutes. Measured locally: 2-7 seconds.
          # The probe paths must be allowed in network-policies.yaml, otherwise linkerd rejects them.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          # /api/health does not check the database, so a short database outage does not cause a
          # restart. If Umbraco started without a database, it answers 500, and then a
          # restart gives a new attempt.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: umbraco-data
              mountPath: /app/umbraco/Data
            # The uSync folder otherwise lives on the container's write layer and disappears at
            # every restart. The schema tolerates that (ContentTypes/DataTypes are baked into
            # the image and are back at boot), but the content export does not.
            # Reuses umbraco-data via subPath, so no new PVC is needed.
            - name: umbraco-data
              mountPath: /app/uSync/v17/Content
              subPath: uSync-content
            # umbraco-media is DELIBERATELY not mounted at /app/wwwroot/media. Media
            # lives in Azure Blob, and a mount here makes static files serve
            # the frozen PVC copy before the blob provider gets a turn. The volume remains
            # as a frozen copy. See Composers/AzureBlobMediaComposer.cs.
            - name: umbraco-logs
              mountPath: /app/umbraco/Logs
      volumes:
        - name: umbraco-data
          persistentVolumeClaim:
            claimName: umbraco-data
        - name: umbraco-media
          persistentVolumeClaim:
            claimName: umbraco-media
        - name: umbraco-logs
          emptyDir: {}
