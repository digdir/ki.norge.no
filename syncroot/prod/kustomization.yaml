apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-kinorgeportal
resources:
  - ../base

images:
  - name: umbraco
    newName: altinncr.azurecr.io/ghcr.io/digdir/ki.norge.no/umbraco
    newTag: will-be-replaced

patches:
  - target:
      kind: Vault
      name: umbraco
    patch: |-
      - op: add
        path: /spec/tags/env
        value: prod
  - target:
      kind: Deployment
      name: umbraco
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__CMS__WebRouting__UmbracoApplicationUrl
          value: https://cms.ki.norge.no
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__CMS__Security__BackOfficeHost
          value: https://cms.ki.norge.no
      # Media lives in Azure Blob. ConnectionString alone turns on
      # AzureBlobMediaComposer. If it is removed, media ends up on the container's own
      # file system and disappears on restart, because umbraco-media is not mounted.
      # The container was filled from the PVC on 2026-08-28, 33 objects verified against
      # md5 taken in the pod. The PVC remains as a frozen copy.
      # See apps/cms-umbraco/Composers/AzureBlobMediaComposer.cs.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__Storage__AzureBlob__Media__ConnectionString
          value: https://kinorgemediaprodbzrw.blob.core.windows.net
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__Storage__AzureBlob__Media__ContainerName
          value: umbraco
      # Same site as the backoffice (cms.ki.norge.no). From workers.dev the
      # preview cookie became a third-party cookie, and Safari lost
      # the preview on the first click in the frame. See apps/frontend/src/lib/preview.ts.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HeadlessPreview__FrontendUrl
          value: https://ki.norge.no
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Cloudflare__SiteBaseUrl
          value: https://ki.norge.no
      # Must never be removed. uSync owns the schema, and without the flag
      # ContentTypeComposer runs the schema asserting against the database, with calls that delete
      # types and fields. This also applies after the composer is removed from the code,
      # because a rollback to an older image still has it.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: USYNC_OWNS_SCHEMA
          value: "true"
      # Reconciles the schema against the committed files at every startup, as
      # the composer did. Only the Settings group: content and media are export-only
      # in the Default set, so they are skipped anyway.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: uSync__Settings__ImportAtStartup
          value: Settings
  - target:
      kind: HTTPRoute
      name: umbraco
    patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - kinorgeportal.prod.dis-core.altinn.cloud
          - cms.ki.norge.no
          - cms-kinorgeportal-prod.digitaliseringsdirektoratet.workers.dev
