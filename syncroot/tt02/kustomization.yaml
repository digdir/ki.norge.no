apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-kinorgeportal
resources:
  - ../base

images:
  - name: umbraco
    newName: altinncr.azurecr.io/ghcr.io/digdir/ki.norge.no/umbraco
    newTag: will-be-replaced

patches:
  - target:
      kind: Vault
      name: umbraco
    patch: |-
      - op: add
        path: /spec/tags/env
        value: tt02
  - target:
      kind: Deployment
      name: umbraco
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__CMS__WebRouting__UmbracoApplicationUrl
          value: https://cms.ki.test.norge.no
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__CMS__Security__BackOfficeHost
          value: https://cms.ki.test.norge.no
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__Storage__AzureBlob__Media__ConnectionString
          value: https://kinorgemediatt0240c8.blob.core.windows.net
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__Storage__AzureBlob__Media__ContainerName
          value: umbraco
      # Same site as the backoffice (cms.ki.test.norge.no). From workers.dev the
      # preview cookie became a third-party cookie, and Safari lost
      # the preview on the first click in the frame. See apps/frontend/src/lib/preview.ts.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HeadlessPreview__FrontendUrl
          value: https://ki.test.norge.no
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Cloudflare__SiteBaseUrl
          value: https://ki.test.norge.no
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: uSync__Settings__DefaultSet
          value: Speiling
      # Must never be removed, see syncroot/prod/kustomization.yaml.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: USYNC_OWNS_SCHEMA
          value: "true"
      # When uSync owns the schema, something must reconcile it against the files at startup,
      # as the composer did. Content is included as well because tt02 should mirror
      # prod: the content folder is persistent (subPath in the base deployment), so every boot
      # puts the last transported prod snapshot back. Side effect: whatever is
      # edited in the tt02 backoffice is reset at the next restart. If tt02 should
      # rather be a place to try things, set this back to Settings.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: uSync__Settings__ImportAtStartup
          value: Settings,Content
  - target:
      kind: HTTPRoute
      name: umbraco
    patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - kinorgeportal.tt02.dis-core.altinn.cloud
          - cms.ki.test.norge.no
          - cms-kinorgeportal-tt02.digitaliseringsdirektoratet.workers.dev
