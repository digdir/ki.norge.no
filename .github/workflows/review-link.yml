name: Review link

# Add the label "review-link" to a PR to get a link to the frontend with the
# PR's changes, on tt02 content, without deploying anything. While the label
# is on, every new push updates the same link. See scripts/review-link.sh.

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: review-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  upload:
    name: Upload review link
    if: >-
      contains(github.event.pull_request.labels.*.name, 'review-link')
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action != 'labeled' || github.event.label.name == 'review-link')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    environment:
      name: review-link
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        working-directory: apps/frontend
        run: pnpm install --frozen-lockfile

      - name: Build and upload
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/review-link.sh "${{ github.event.pull_request.number }}"

      - name: Comment the link on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- review-link -->'
          body="$marker
          **Review link:** $URL

          Built from ${SHA:0:7}. It shows tt02 content, is not indexed, and the KI-tiltak form cannot be sent from it. tt02 itself is not changed. A new push updates the link while the label is on."
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
