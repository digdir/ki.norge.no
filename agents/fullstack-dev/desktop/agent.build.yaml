apiVersion: agents.platform/v1alpha1
kind: AgentVariant
extends: agent.yaml

metadata:
  name: kinorge-fullstack-dev-build

# The agent with its image built from this checkout, to try a change to the Dockerfile or what it copies before CI
# publishes it, at full size. `nested-build` does the same inside another agent.
spec:
  sandbox:
    image:
      type: build
      context: ..
      dockerfile: Dockerfile
      target: desktop
