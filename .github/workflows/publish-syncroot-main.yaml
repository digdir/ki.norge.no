name: Publish Syncroot artifacts
run-name: Deploy ${{ inputs.image-tag }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        type: choice
        options:
          - tt02
          - prod
      image-tag:
        description: "Umbraco image tag to deploy"
        required: true

env:
  SYNCROOT_ARTIFACT_NAME: kinorgeportal/syncroot

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-flux-artifacts-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-syncroot:
    name: Publish syncroot artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The inputs go via env and not straight into the script. Otherwise an
      # image tag containing ' runs as shell, with the access this job has to prod.
      # The pod is locked to the digest the tag points to now, so a tag that is moved
      # later does not swap the image under us.
      - name: Pin image to digest
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag. Use a Docker tag: letters, digits, _ . and -, max 128 characters." >&2
            exit 1
          fi
          case "$TARGET_ENV" in
            tt02|prod) ;;
            *) echo "Unknown environment: $TARGET_ENV" >&2; exit 1 ;;
          esac
          kustomization="./syncroot/$TARGET_ENV/kustomization.yaml"
          new_name=$(yq '.images[] | select(.name == "umbraco") | .newName' "$kustomization")
          source_image="${new_name#altinncr.azurecr.io/}:$IMAGE_TAG"
          IMAGE_DIGEST=$(docker buildx imagetools inspect "$source_image" --format '{{json .Manifest}}' | jq -r '.digest')
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Found no digest for $source_image. Does the tag exist?" >&2
            exit 1
          fi
          export IMAGE_DIGEST
          yq -i '(.images[] | select(.name == "umbraco")) |= (.newTag = strenv(IMAGE_TAG) | .digest = strenv(IMAGE_DIGEST))' "$kustomization"
          echo "$source_image locked to $IMAGE_DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"

      # Both environments run Azure SQL, and the base manifest points to SQLite.
      # The connection is therefore rewritten at every publish, without any choice that
      # can point an environment at an empty database.
      - name: Update db connection string
        run: yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "ConnectionStrings__umbracoDbDSN")).value = "Server=tcp:${UMBRACO_SQL_CONN_FQDN},1433;Initial Catalog=umbraco;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;Authentication=\"Active Directory Default\""' ./syncroot/base/umbraco/deployment.yaml

      - name: Update db provider
        run: yq -i '(.spec.template.spec.containers[0].env[] | select(.name == "ConnectionStrings__umbracoDbDSN_ProviderName")).value = "Microsoft.Data.SqlClient"' ./syncroot/base/umbraco/deployment.yaml

      - name: Build and push syncroot artifact
        uses: Altinn/altinn-platform/actions/flux/build-push-image@ab3656b2ab07581eec4169f0f31ac5643be9839d # main
        with:
          image_name: ${{ env.SYNCROOT_ARTIFACT_NAME }}
          tag: ${{ inputs.environment }}
          workdir: ./syncroot
          azure_subscription_id: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}
          azure_app_id: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}

