apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-kinorgeportal
resources:
  - ../base

images:
  - name: umbraco
    newName: altinncr.azurecr.io/ghcr.io/digdir/ki.norge.no/umbraco
    newTag: will-be-replaced

patches:
  - target:
      kind: Vault
      name: umbraco
    patch: |-
      - op: add
        path: /spec/tags/env
        value: prod
  - target:
      kind: Deployment
      name: umbraco
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__CMS__WebRouting__UmbracoApplicationUrl
          value: https://cms.ki.norge.no
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__CMS__Security__BackOfficeHost
          value: https://cms.ki.norge.no
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__Storage__AzureBlob__Media__ConnectionString
          value: https://kinorgemediaprodbzrw.blob.core.windows.net
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Umbraco__Storage__AzureBlob__Media__ContainerName
          value: umbraco
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HeadlessPreview__FrontendUrl
          value: https://ki-norge-frontend-prod.digitaliseringsdirektoratet.workers.dev
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Cloudflare__SiteBaseUrl
          value: https://ki.norge.no
      # uSync overtar skjemaet fra ContentTypeComposer. Composeren staar igjen i
      # koden, men hopper over skjema-asserting naar denne er satt, saa rollback
      # er aa fjerne disse to blokkene og deploye paa nytt.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: USYNC_OWNS_SCHEMA
          value: "true"
      # Reconcilerer skjemaet mot de committede filene ved hver oppstart, slik
      # composeren gjorde. Kun Settings-gruppa: innhold og media er eksport-only
      # i Default-settet, saa de hoppes over uansett.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: uSync__Settings__ImportAtStartup
          value: Settings
  - target:
      kind: HTTPRoute
      name: umbraco
    patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - kinorgeportal.prod.dis-core.altinn.cloud
          - cms.ki.norge.no
          - cms-kinorgeportal-prod.digitaliseringsdirektoratet.workers.dev
