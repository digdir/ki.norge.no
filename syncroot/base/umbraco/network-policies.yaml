apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: umbraco-http-server
  labels:
    app.kubernetes.io/name: umbraco
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: umbraco
  port: http
  # Kestrel only speaks HTTP/1.1 in clear text. With HTTP/2 here the proxy answers
  # the kubelet probes with HTTP/2 frames, and kubelet reports "malformed HTTP response".
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1beta2
kind: HTTPRoute
metadata:
  name: umbraco-http-route
spec:
  parentRefs:
    - name: umbraco-http-server
      kind: Server
      group: policy.linkerd.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: umbraco-http-auth
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: umbraco-http-route
  requiredAuthenticationRefs:
    - name: traefik
      kind: MeshTLSAuthentication
      group: policy.linkerd.io
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: traefik
spec:
  identities:
    - "altinn-traefik.traefik.serviceaccount.identity.linkerd.cluster.local"
---
# Linkerd allows probes by itself only when the Server has no HTTPRoutes of its own.
# The route above means kubelet otherwise gets 403. Exact and longer than "/", so these win.
# The paths are already public via Traefik, so the whole network opens nothing new.
apiVersion: policy.linkerd.io/v1beta2
kind: HTTPRoute
metadata:
  name: umbraco-probe-route
spec:
  parentRefs:
    - name: umbraco-http-server
      kind: Server
      group: policy.linkerd.io
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/health
          method: GET
        - path:
            type: Exact
            value: /api/health/ready
          method: GET
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: umbraco-probe-auth
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: umbraco-probe-route
  requiredAuthenticationRefs:
    - name: kubelet
      kind: NetworkAuthentication
      group: policy.linkerd.io
---
apiVersion: policy.linkerd.io/v1alpha1
kind: NetworkAuthentication
metadata:
  name: kubelet
spec:
  networks:
    - cidr: 0.0.0.0/0
    - cidr: ::/0
