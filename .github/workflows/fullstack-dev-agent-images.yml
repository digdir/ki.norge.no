# Builds the images of the full-stack developer agent from agents/fullstack-dev, and on main publishes them to
# ghcr.io/digdir/ki.norge.no/fullstack-dev-minimal and -desktop as `latest` and `sha-<commit>`, which the agent's
# manifests reference. Pull requests only build them.
#
# Each architecture builds on a native runner, both stages in one job so that desktop reuses minimal's layers, and
# pushes by digest. The publish job joins the two architectures into multi-platform images under their tags.
name: fullstack-dev agent images

on:
  pull_request:
    branches:
      - main
    paths:
      - agents/fullstack-dev/Dockerfile
      - agents/fullstack-dev/.dockerignore
      - agents/fullstack-dev/common/**
      - .github/workflows/fullstack-dev-agent-images.yml
  push:
    branches:
      - main
    paths:
      - agents/fullstack-dev/Dockerfile
      - agents/fullstack-dev/.dockerignore
      - agents/fullstack-dev/common/**
      - .github/workflows/fullstack-dev-agent-images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fullstack-dev-agent-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REPOSITORY: ghcr.io/digdir/ki.norge.no/fullstack-dev
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # archive.ubuntu.com and security.ubuntu.com are often slow from GitHub's runners, so amd64 installs from
          # Azure's mirror (see APT_MIRROR in the Dockerfile; the images keep Ubuntu's own sources). arm64 uses
          # ports.ubuntu.com, which is fast.
          - arch: amd64
            runner: ubuntu-24.04
            apt_mirror: http://azure.archive.ubuntu.com/ubuntu
          - arch: arm64
            runner: ubuntu-24.04-arm
            apt_mirror: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: agents/fullstack-dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build images
        env:
          ARCH: ${{ matrix.arch }}
          APT_MIRROR: ${{ matrix.apt_mirror }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          for target in minimal desktop; do
            args=(
              --platform "linux/${ARCH}"
              --target "${target}"
              --build-arg "APT_MIRROR=${APT_MIRROR}"
              --provenance=false
              --sbom=false
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
              --label "org.opencontainers.image.revision=${GITHUB_SHA}"
              --label "org.opencontainers.image.title=fullstack-dev-${target}"
              --label "org.opencontainers.image.description=The image of the ki.norge.no full-stack developer agent (${target})"
              --cache-from "type=gha,scope=fullstack-dev-${target}-${ARCH}"
              --metadata-file "${RUNNER_TEMP}/metadata-${target}.json"
            )
            if [ "${PUBLISH}" = true ]; then
              args+=(
                --cache-to "type=gha,scope=fullstack-dev-${target}-${ARCH},mode=max"
                --output "type=image,name=${REPOSITORY}-${target},push-by-digest=true,name-canonical=true,push=true"
              )
            fi
            docker buildx build "${args[@]}" agents/fullstack-dev
            if [ "${PUBLISH}" = true ]; then
              digest="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/metadata-${target}.json")"
              case "${digest}" in
                sha256:*) printf '%s\n' "${digest}" > "${RUNNER_TEMP}/digests/${target}" ;;
                *) echo "::error::no image digest for ${target}"; exit 1 ;;
              esac
            fi
          done

      - name: Upload image digests
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Tag multi-platform images
        run: |
          set -euo pipefail
          digests="${RUNNER_TEMP}/digests"
          for target in minimal desktop; do
            image="${REPOSITORY}-${target}"
            docker buildx imagetools create \
              --tag "${image}:latest" \
              --tag "${image}:sha-${GITHUB_SHA::10}" \
              "${image}@$(cat "${digests}/digests-amd64/${target}")" \
              "${image}@$(cat "${digests}/digests-arm64/${target}")"
            docker buildx imagetools inspect "${image}:latest"
          done
